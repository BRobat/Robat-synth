[package]
name = "robat-synth"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Keyboard-driven node synth that streams multichannel audio into Logic Pro"

[dependencies]
engine = { path = "../crates/engine" }
pattern = { path = "../crates/pattern" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
cpal = "0.18"
dirs = "6"

[package.metadata.bundle]
name = "Robat Synth"
identifier = "com.robat.synth"
category = "public.app-category.music"
short_description = "Keyboard-driven node synth for Logic Pro"
osx_minimum_system_version = "11.0"
